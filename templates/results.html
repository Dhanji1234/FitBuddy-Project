<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your FitBuddy Plan</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            max-width: 850px; 
            width: 100%; 
        }
        h1 { 
            color: #764ba2; 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 2.5rem;
        }
        .plan-box { 
            background: #f0fdf4; 
            border-left: 8px solid #22c55e; 
            padding: 30px; 
            border-radius: 12px; 
            font-size: 16px; 
            line-height: 1.8; 
            color: #333; 
            white-space: pre-wrap; /* Yeh AI ke paragraphs aur lines ko sahi se dikhayega */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .btn { 
            display: block; 
            width: 250px; 
            margin: 40px auto 0; 
            padding: 15px; 
            text-align: center; 
            background: #667eea; 
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn:hover { 
            background: #5a6fd6; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 Your Custom Fitness Plan</h1>
        
        <div class="plan-box">{{ plan }}</div>

        <a href="/" class="btn">&larr; Create Another Plan</a>
    </div>

</body>
</html>
